name: Arduino examples

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      example:
        description: "changed, all, or one sketch directory name"
        required: false
        default: all

permissions:
  contents: read

concurrency:
  group: arduino-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.examples.outputs.matrix }}
      has_examples: ${{ steps.examples.outputs.has_examples }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: examples
        env:
          SELECTION: ${{ github.event.inputs.example || 'changed' }}
        run: python .github/scripts/discover_arduino_examples.py --selection "$SELECTION"

  build:
    needs: discover
    if: needs.discover.outputs.has_examples == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.discover.outputs.matrix).include }}
        core:
          - 3.3.11
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-arduino-cli@v2
      - name: Install Arduino-ESP32 ${{ matrix.core }}
        env:
          CORE_VERSION: ${{ matrix.core }}
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@$CORE_VERSION"
      - name: Build ${{ matrix.project.name }}
        env:
          PROJECT_PATH: ${{ matrix.project.example }}
          PROJECT_NAME: ${{ matrix.project.name }}
        run: >-
          bash .github/scripts/build_arduino.sh
          "$PROJECT_PATH"
          ".ci-build/arduino/$PROJECT_NAME"
          ".ci-output/arduino/$PROJECT_NAME"
      - id: package
        name: Package flash bundle
        env:
          PROJECT_PATH: ${{ matrix.project.example }}
          PROJECT_NAME: ${{ matrix.project.name }}
          CORE_VERSION: ${{ matrix.core }}
          OUTPUT_DIR: ${{ runner.temp }}/release-artifacts
        run: >-
          python .github/scripts/package_arduino.py
          --sketch "$PROJECT_PATH"
          --build-dir ".ci-build/arduino/$PROJECT_NAME"
          --name "$PROJECT_NAME"
          --core-version "$CORE_VERSION"
          --output-dir "$OUTPUT_DIR"
      - name: Upload flash bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.project.name }}-arduino-${{ matrix.core }}
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error

  result:
    name: Arduino matrix result
    if: always()
    needs:
      - discover
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected matrix to pass
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          HAS_EXAMPLES: ${{ needs.discover.outputs.has_examples }}
        run: |
          if [[ "$DISCOVER_RESULT" != "success" ]]; then
            echo "Arduino discovery failed: $DISCOVER_RESULT" >&2
            exit 1
          fi
          if [[ "$HAS_EXAMPLES" == "true" && "$BUILD_RESULT" != "success" ]]; then
            echo "Selected Arduino matrix did not pass: $BUILD_RESULT" >&2
            exit 1
          fi
          echo "Arduino routing completed (selected=$HAS_EXAMPLES, build=$BUILD_RESULT)."
