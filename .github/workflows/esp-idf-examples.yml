name: ESP-IDF examples

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      example:
        description: "changed, all, or one example directory name"
        required: false
        default: all

permissions:
  contents: read

concurrency:
  group: esp-idf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.examples.outputs.matrix }}
      has_examples: ${{ steps.examples.outputs.has_examples }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: examples
        env:
          SELECTION: ${{ github.event.inputs.example || 'changed' }}
        run: python .github/scripts/discover_esp_idf_examples.py --selection "$SELECTION"

  build:
    needs: discover
    if: needs.discover.outputs.has_examples == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.discover.outputs.matrix).include }}
        idf:
          - v5.5.5
          - v6.0.2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build ${{ matrix.project.name }} with ESP-IDF ${{ matrix.idf }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          path: ${{ matrix.project.example }}
          target: esp32c6
          esp_idf_version: ${{ matrix.idf }}
      - id: package
        name: Package flash bundle
        env:
          PROJECT_PATH: ${{ matrix.project.example }}
          PROJECT_NAME: ${{ matrix.project.name }}
          IDF_VERSION: ${{ matrix.idf }}
          PACKAGE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/release-artifacts
        run: >-
          python .github/scripts/package_esp_idf.py
          --project "$PROJECT_PATH"
          --build-dir "$PROJECT_PATH/build"
          --name "$PROJECT_NAME"
          --framework-version "$IDF_VERSION"
          --output-dir "$OUTPUT_DIR"
      - name: Upload flash bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.project.name }}-esp-idf-${{ matrix.idf }}
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error

  result:
    name: ESP-IDF matrix result
    if: always()
    needs:
      - discover
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the selected matrix to pass
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          HAS_EXAMPLES: ${{ needs.discover.outputs.has_examples }}
        run: |
          if [[ "$DISCOVER_RESULT" != "success" ]]; then
            echo "ESP-IDF discovery failed: $DISCOVER_RESULT" >&2
            exit 1
          fi
          if [[ "$HAS_EXAMPLES" == "true" && "$BUILD_RESULT" != "success" ]]; then
            echo "Selected ESP-IDF matrix did not pass: $BUILD_RESULT" >&2
            exit 1
          fi
          echo "ESP-IDF routing completed (selected=$HAS_EXAMPLES, build=$BUILD_RESULT)."
