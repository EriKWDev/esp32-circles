[package]
name = "touch-circles"
version = "0.1.0"
edition = "2024"

[features]
profile = []

[dependencies]
esp-hal = { version = "1.1.0", features = ["esp32c6", "unstable"] }
esp-backtrace = { version = "0.18", features = ["esp32c6", "panic-handler", "println"] }
esp-println = { version = "0.16", features = ["esp32c6", "log-04"] }
esp-bootloader-esp-idf = { version = "0.5", features = ["esp32c6"] }
esp-radio = { version = "1.0.0-beta.0", features = ["esp32c6", "wifi", "unstable"] }
esp-alloc = "0.10"
smoltcp = { version = "0.12", default-features = false, features = ["medium-ethernet", "proto-ipv4", "proto-dhcpv4", "socket-tcp", "socket-dhcpv4", "socket-dns"] }
md-5 = { version = "0.10", default-features = false }
esp-rtos = { version = "0.3.0", features = ["esp32c6", "esp-radio", "esp-alloc"] }
embassy-futures = "0.1.2"
esp-storage = { version = "0.9", features = ["esp32c6"] }
embedded-storage = "0.3"

# Host-side only: rasterizes the bundled TTFs into anti-aliased coverage maps
# (see build.rs). None of this ships in the firmware.
[build-dependencies]
fontdue = "0.9"

[profile.dev]
opt-level = 3
debug = 1

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
debug = 0
strip = "symbols"
