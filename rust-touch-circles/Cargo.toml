[package]
name = "touch-circles"
version = "0.1.0"
edition = "2024"

[dependencies]
esp-hal = { version = "1.1.0", features = ["esp32c6", "unstable"] }
esp-backtrace = { version = "0.18", features = ["esp32c6", "panic-handler", "println"] }
esp-println = { version = "0.16", features = ["esp32c6", "log-04"] }
esp-bootloader-esp-idf = { version = "0.5", features = ["esp32c6"] }

[profile.dev]
opt-level = 3
debug = 1

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
debug = 0
strip = "symbols"
